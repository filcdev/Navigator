# tasks/user_service.yml
# Optional systemd --user service. The kiosk is launched via .bash_profile
# (autologin -> cage) as the primary mechanism, so this service is kept DISABLED
# to avoid running two cage instances. Enable it if you switch away from the
# .bash_profile launcher.
- name: Create systemd user service directory for kiosk
  ansible.builtin.file:
    path: "/home/{{ kiosk_user }}/.config/systemd/user"
    state: directory
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"

- name: Write navigator-kiosk systemd user service
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/navigator-kiosk.service"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
    content: |
      [Unit]
      Description=Navigator Kiosk Session (cage + navigator)
      After=default.target

      [Service]
      Type=simple
      Environment=XDG_RUNTIME_DIR=/run/user/%U
      Environment=XDG_CACHE_HOME={{ ro_xdg_base }}/cache
      Environment=XDG_DATA_HOME={{ ro_xdg_base }}/data
      Environment=XDG_STATE_HOME={{ ro_xdg_base }}/state
      ExecStart=/usr/bin/cage -- {{ kiosk_binary }}
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=default.target

- name: Get kiosk user ID
  ansible.builtin.getent:
    database: passwd
    key: "{{ kiosk_user }}"
  register: getent_passwd

- name: Ensure navigator-kiosk user service is disabled (avoid double launch)
  ansible.builtin.systemd:
    name: navigator-kiosk.service
    enabled: false
    state: stopped
    scope: user
  become: true
  become_user: "{{ kiosk_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.ansible_facts.getent_passwd[kiosk_user][2] }}"
