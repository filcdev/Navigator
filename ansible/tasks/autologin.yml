# tasks/autologin.yml
# Starts Cage automatically at boot as a systemd SYSTEM service, per the Cage
# wiki: https://github.com/cage-kiosk/cage/wiki/Starting-Cage-on-boot-with-systemd
#
# Why a system unit instead of getty autologin + .bash_profile:
#   - PAMName= registers a real logind session, which sets XDG_RUNTIME_DIR and
#     grants DRM/input device access — both required by wlroots/cage.
#   - Launching cage from a login shell (the old approach) had no logind session
#     and no XDG_RUNTIME_DIR, so cage failed to start.

- name: Write cage PAM stack (authenticates and registers the logind session)
  ansible.builtin.copy:
    dest: /etc/pam.d/cage
    owner: root
    group: root
    mode: "0644"
    content: |
      auth       required  pam_unix.so nullok
      account    required  pam_unix.so
      session    required  pam_unix.so
      session    required  pam_systemd.so

- name: Write cage@.service system unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/cage@.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # System unit launching Cage with the kiosk user as an auto-login session.
      # Requires wlroots built with systemd logind support (Debian's cage is).
      [Unit]
      Description=Cage Wayland compositor on %I
      # Start after logins are permitted; before the graphical session completes.
      After=systemd-user-sessions.service plymouth-quit-wait.service
      Before=graphical.target
      # Only on systems with virtual consoles.
      ConditionPathExists=/dev/tty0
      # logind is required for session management and device access.
      Wants=dbus.socket systemd-logind.service
      After=dbus.socket systemd-logind.service
      # Replace the getty that would otherwise own this TTY.
      Conflicts=getty@%i.service
      After=getty@%i.service

      [Service]
      Type=simple
      # Wait for a default route before starting the app (it fetches the backend
      # on startup); mirrors the old .bash_profile behaviour and never fails.
      ExecStartPre=/bin/sh -c 'for i in $$(seq 1 60); do ip route show default >/dev/null 2>&1 && exit 0; sleep 1; done; exit 0'
      ExecStart=/usr/bin/cage -- {{ kiosk_binary }}
      ExecStartPost=+sh -c "tty_name='%i'; exec chvt $${tty_name#tty}"
      Restart=always
      User={{ kiosk_user }}
      # Redirect app cache/state to tmpfs so the read-only root never gets written.
      Environment=XDG_CACHE_HOME={{ ro_xdg_base }}/cache
      Environment=XDG_DATA_HOME={{ ro_xdg_base }}/data
      Environment=XDG_STATE_HOME={{ ro_xdg_base }}/state
      # Log this user with utmp so they show up in 'w'/'who'.
      UtmpIdentifier=%I
      UtmpMode=user
      # The virtual terminal the session runs on.
      TTYPath=/dev/%I
      TTYReset=yes
      TTYVHangup=yes
      TTYVTDisallocate=yes
      # Fail if we can't control the virtual terminal.
      StandardInput=tty-fail
      # Register a full user session with logind (sets XDG_RUNTIME_DIR etc.).
      PAMName=cage

      [Install]
      WantedBy=graphical.target
      Alias=display-manager.service
      DefaultInstance={{ autologin_tty }}

- name: Enable the cage service on the kiosk TTY
  ansible.builtin.systemd:
    name: "cage@{{ autologin_tty }}.service"
    enabled: true
    daemon_reload: true

- name: Read current systemd default target
  ansible.builtin.command: systemctl get-default
  register: default_target
  changed_when: false

- name: Set graphical.target as the systemd default target
  ansible.builtin.command: systemctl set-default graphical.target
  when: default_target.stdout != "graphical.target"

- name: Remove obsolete getty autologin override
  ansible.builtin.file:
    path: "/etc/systemd/system/getty@{{ autologin_tty }}.service.d/autologin.conf"
    state: absent
  notify: Reload systemd

- name: Write clean .bash_profile (cage is now started by the system unit)
  ansible.builtin.copy:
    dest: "/home/{{ kiosk_user }}/.bash_profile"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
    content: |
      # Source .bashrc if it exists
      [[ -f ~/.bashrc ]] && . ~/.bashrc

      # Redirect app cache/state to tmpfs so the read-only root never gets written
      export XDG_CACHE_HOME={{ ro_xdg_base }}/cache
      export XDG_DATA_HOME={{ ro_xdg_base }}/data
      export XDG_STATE_HOME={{ ro_xdg_base }}/state
