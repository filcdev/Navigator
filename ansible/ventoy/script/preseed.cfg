# Debian automated install (preseed) — Ventoy auto-install template
# Injected by Ventoy's auto_install plugin; no manual boot args needed.
#
# Things you may want to tweak:
#   - time/zone and locale
#   - networking (DHCP by default, static block below)
#   - the temporary password for the ansible user

# --- Locale & keyboard ---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string navigator
d-i netcfg/get_domain string local

# Static IP for the kiosk (uncomment to use 10.1.0.68):
#d-i netcfg/disable_autoconfig boolean true
#d-i netcfg/get_ipaddress string 10.1.0.68
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 10.1.0.1
#d-i netcfg/get_nameservers string 1.1.1.1
#d-i netcfg/confirm_static boolean true

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Clock ---
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Budapest

# --- Partitioning: use the entire disk ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Users: no root login, 'ansible' user ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ansible
d-i passwd/username string ansible
# Temporary password, change it if you ever need password login:
d-i passwd/user-password password ChangeMeNow
d-i passwd/user-password-again password ChangeMeNow

# --- Software ---
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string openssh-server sudo python3 curl
popularity-contest popularity-contest/participate boolean false

# --- Finish: install the deployment SSH key + passwordless sudo ---
d-i preseed/late_command string \
    in-target sh -c 'mkdir -p /home/ansible/.ssh && chmod 700 /home/ansible/.ssh && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHjvXph1/TGLxcnbNDfNbSUD5rRam9G0Ye0bcJufmk5h ansible@proxmox" > /home/ansible/.ssh/authorized_keys && chmod 600 /home/ansible/.ssh/authorized_keys && chown -R ansible:ansible /home/ansible/.ssh && echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible && chmod 440 /etc/sudoers.d/ansible'

d-i finish-install/reboot_in_progress note
