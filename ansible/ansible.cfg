[defaults]
# /tmp is a tmpfs on the kiosk; ~/.ansible/tmp is on the read-only root after provisioning
remote_tmp = /tmp/.ansible/tmp
host_key_checking = False
interpreter_python = auto_silent
# needed for tasks that become an unprivileged user (kiosk systemd --user)
allow_world_readable_tmpfiles = True
# Run playbooks from the ansible/ directory so the relative SSH key path resolves:
#   cd ansible && ansible-playbook -i inventory.ini site.yml
